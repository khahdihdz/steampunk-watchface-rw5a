name: Face binary

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/binface.py"
      - "scripts/validate_fprj.py"
      - "scripts/check_bin.py"
      - "scripts/steampunk.py"
      - ".github/workflows/bin.yml"

permissions:
  contents: read

env:
  FACE_ID: "146125642"
  FACE_TITLE: "AETHER Steampunk"

jobs:
  project:
    name: Render EasyFace project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-noto-core fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build project
        run: python scripts/binface.py --out build/fprj

      - name: Validate project
        run: python scripts/validate_fprj.py build/fprj

      - name: Upload project
        uses: actions/upload-artifact@v4
        with:
          name: fprj-project
          path: |
            build/fprj/face.fprj
            build/fprj/images/
            build/fprj/preview_dryrun.png
          if-no-files-found: error

  binary:
    name: Compile .bin (Mi-Create toolchain)
    needs: project
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - name: Download project
        uses: actions/download-artifact@v4
        with:
          name: fprj-project
          path: project

      - name: Fetch compile.exe
        shell: pwsh
        env:
          BLOB_SHA: ${{ vars.MICREATE_COMPILER_SHA || '3c015d01143f5c4b3d0ab207baf20684027ebf89' }}
        run: |
          $headers = @{
            "User-Agent" = "steampunk-rw5a-ci"
            "Accept"     = "application/vnd.github+json"
          }
          $uri = "https://api.github.com/repos/ooflet/Mi-Create/git/blobs/$env:BLOB_SHA"
          $blob = Invoke-RestMethod -Uri $uri -Headers $headers
          [IO.File]::WriteAllBytes("compile.exe", [Convert]::FromBase64String($blob.content))
          $size = (Get-Item compile.exe).Length
          if ($size -lt 1000000) { throw "compile.exe tải hỏng ($size byte)" }
          "compile.exe: $size byte"

      - name: Compile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\bin | Out-Null
          $projDir = (Resolve-Path "project").Path
          $out = Join-Path $projDir "output"
          New-Item -ItemType Directory -Force $out | Out-Null
          .\compile.exe -b "$projDir\face.fprj" $out "steampunk-rw5a.face" "$env:FACE_ID"
          $face = Join-Path $out "steampunk-rw5a.face"
          if (-not (Test-Path $face)) {
            Get-ChildItem -Recurse $projDir | Format-Table FullName, Length
            throw "compile.exe không tạo ra file .face"
          }
          Move-Item $face "build\bin\steampunk-rw5a.face" -Force

      - name: Stamp face id & rename
        shell: pwsh
        run: |
          $face = "build\bin\steampunk-rw5a.face"
          $bytes = [IO.File]::ReadAllBytes($face)
          $magic = ($bytes[0..3] | ForEach-Object { $_.ToString("X2") }) -join ""
          if ($magic -ne "5AA53412") { throw "magic 5AA53412 không khớp ($magic)" }
          # compile.exe luôn ghi id mặc định; Mi-Create cũng vá lại sau khi build.
          $idBytes = [Text.Encoding]::ASCII.GetBytes($env:FACE_ID)
          [Array]::Copy($idBytes, 0, $bytes, 40, $idBytes.Length)
          for ($i = 40 + $idBytes.Length; $i -lt 104; $i++) { $bytes[$i] = 0 }
          [IO.File]::WriteAllBytes("build\bin\steampunk-rw5a.bin", $bytes)
          Remove-Item $face
          Get-FileHash "build\bin\steampunk-rw5a.bin" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  steampunk-rw5a.bin" } |
            Set-Content "build\bin\steampunk-rw5a.bin.sha256"
          Write-Host "kích thước: $($bytes.Length) byte"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: watchface-bin
          path: |
            build/bin/steampunk-rw5a.bin
            build/bin/steampunk-rw5a.bin.sha256
          if-no-files-found: error

  verify:
    name: Verify .bin container
    needs: binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: watchface-bin
          path: build/bin

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check container
        run: |
          python scripts/check_bin.py build/bin/steampunk-rw5a.bin \
            --name "${{ env.FACE_TITLE }}"
          cd build/bin && sha256sum -c steampunk-rw5a.bin.sha256
